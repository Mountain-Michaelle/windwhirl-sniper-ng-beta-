[pytest]
# apps/oms/test/* marks every async test with an explicit
# `@pytest.mark.asyncio` (the mark count equals the async-test count in each
# file), so strict mode is correct: it runs exactly the marked tests and leaves
# sync tests alone. Registering the marker here is what silences the
# "PytestUnknownMarkWarning" that pytest-asyncio's presence would otherwise
# not resolve on its own.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: run this async test on a dedicated event loop (pytest-asyncio)
